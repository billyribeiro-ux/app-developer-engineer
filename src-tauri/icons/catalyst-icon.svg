<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1b2e"/>
      <stop offset="100%" style="stop-color:#0d0e1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6C63FF"/>
      <stop offset="50%" style="stop-color:#8B5CF6"/>
      <stop offset="100%" style="stop-color:#A78BFA"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6C63FF;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#A78BFA;stop-opacity:0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="20" flood-color="#6C63FF" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect x="32" y="32" width="960" height="960" rx="220" ry="220" fill="url(#bg)"/>

  <!-- Subtle border -->
  <rect x="32" y="32" width="960" height="960" rx="220" ry="220" fill="none" stroke="#2a2b4a" stroke-width="2"/>

  <!-- Glow effect behind the symbol -->
  <circle cx="512" cy="480" r="260" fill="url(#glow)"/>

  <!-- Hexagon shape - catalyst/chemistry symbol -->
  <g transform="translate(512, 460)" filter="url(#shadow)">
    <!-- Outer hexagon ring -->
    <polygon points="0,-200 173,-100 173,100 0,200 -173,100 -173,-100"
             fill="none" stroke="url(#accent)" stroke-width="12" stroke-linejoin="round"/>

    <!-- Inner connecting lines (benzene-like catalyst symbol) -->
    <polygon points="0,-140 121,-70 121,70 0,140 -121,70 -121,-70"
             fill="none" stroke="url(#accent)" stroke-width="6" stroke-linejoin="round" opacity="0.5"/>

    <!-- Center dot -->
    <circle cx="0" cy="0" r="24" fill="url(#accent)"/>

    <!-- Node dots at vertices -->
    <circle cx="0" cy="-200" r="14" fill="#6C63FF"/>
    <circle cx="173" cy="-100" r="14" fill="#7C73FF"/>
    <circle cx="173" cy="100" r="14" fill="#8B5CF6"/>
    <circle cx="0" cy="200" r="14" fill="#9B7BF6"/>
    <circle cx="-173" cy="100" r="14" fill="#8B5CF6"/>
    <circle cx="-173" cy="-100" r="14" fill="#7C73FF"/>

    <!-- Connecting spokes from center to vertices -->
    <line x1="0" y1="0" x2="0" y2="-200" stroke="url(#accent)" stroke-width="3" opacity="0.3"/>
    <line x1="0" y1="0" x2="173" y2="-100" stroke="url(#accent)" stroke-width="3" opacity="0.3"/>
    <line x1="0" y1="0" x2="173" y2="100" stroke="url(#accent)" stroke-width="3" opacity="0.3"/>
    <line x1="0" y1="0" x2="0" y2="200" stroke="url(#accent)" stroke-width="3" opacity="0.3"/>
    <line x1="0" y1="0" x2="-173" y2="100" stroke="url(#accent)" stroke-width="3" opacity="0.3"/>
    <line x1="0" y1="0" x2="-173" y2="-100" stroke="url(#accent)" stroke-width="3" opacity="0.3"/>
  </g>

  <!-- CATALYST text -->
  <text x="512" y="780" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="82" font-weight="700" letter-spacing="14" fill="url(#accent)">CATALYST</text>

  <!-- Subtle tagline -->
  <text x="512" y="830" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="32" font-weight="400" letter-spacing="6" fill="#6C63FF" opacity="0.5">STUDIO</text>
</svg>
